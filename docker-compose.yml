# ==============================================================================
# TeleMind - Docker Infrastructure (PostgreSQL with pgvector + Redis)
# ==============================================================================

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: telemind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-telemind_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-telemind_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-telemind}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-telemind_admin} -d ${POSTGRES_DB:-telemind}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - telemind-network

  redis:
    image: redis:7-alpine
    container_name: telemind-redis
    restart: unless-stopped
    command: >
      redis-server 
      --requirepass ${REDIS_PASSWORD:-telemind_redis_secret}
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy noeviction
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-telemind_redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - telemind-network

networks:
  telemind-network:
    name: telemind_network
    driver: bridge

volumes:
  postgres_data:
    name: telemind_postgres_data
  redis_data:
    name: telemind_redis_data
