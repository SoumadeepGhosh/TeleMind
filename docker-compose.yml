version: '3.9'

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL 16 with pgvector extension enabled
  # ----------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: telemind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-telemind_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-telemind_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-telemind}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-telemind_admin} -d ${POSTGRES_DB:-telemind}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - telemind-network

  # ----------------------------------------------------------------------------
  # Redis 7 with Persistence for BullMQ & Caching
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: telemind-redis
    restart: unless-stopped
    command: >
      redis-server 
      --requirepass ${REDIS_PASSWORD:-telemind_redis_secret}
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy noeviction
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-telemind_redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - telemind-network

  # ----------------------------------------------------------------------------
  # TeleMind API Server (NestJS)
  # ----------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      target: production
    container_name: telemind-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    ports:
      - "${PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - telemind-network

  # ----------------------------------------------------------------------------
  # TeleMind Background Worker (BullMQ & Rag Processing)
  # ----------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
      target: production
    container_name: telemind-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    networks:
      - telemind-network

  # ----------------------------------------------------------------------------
  # TeleMind Admin Dashboard (Next.js)
  # ----------------------------------------------------------------------------
  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
      target: production
    container_name: telemind-dashboard
    restart: unless-stopped
    depends_on:
      - api
    env_file:
      - .env
    ports:
      - "3001:3000"
    networks:
      - telemind-network

networks:
  telemind-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
