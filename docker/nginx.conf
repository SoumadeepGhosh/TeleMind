# ==============================================================================
# Nginx Reverse Proxy Configuration for TeleMind
# Supports HTTP/2, SSL termination, WebSockets, and Rate Limiting
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=telegram_webhook_limit:10m rate=50r/s;

    # Upstreams
    upstream telemind_api {
        server api:3000;
        keepalive 32;
    }

    upstream telemind_dashboard {
        server dashboard:3000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name telemind.example.com api.telemind.example.com;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name api.telemind.example.com;

        # SSL Certificates (managed via Certbot or mounted volume)
        ssl_certificate /etc/letsencrypt/live/api.telemind.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.telemind.example.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Security Headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        client_max_body_size 30M;

        # Telegram Webhook Endpoint
        location /api/v1/telegram/webhook {
            limit_req zone=telegram_webhook_limit burst=20 nodelay;
            proxy_pass http://telemind_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # General API Endpoints
        location /api/ {
            limit_req zone=api_limit burst=15 nodelay;
            proxy_pass http://telemind_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 443 ssl http2;
        server_name telemind.example.com;

        ssl_certificate /etc/letsencrypt/live/telemind.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/telemind.example.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://telemind_dashboard;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
